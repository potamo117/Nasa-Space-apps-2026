<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Base Lunar Artemis - Comida (P4)</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/comida.css">
  <style>
    body {
      background-color: #11151e;
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
  </style>
</head>
<body>
  <div id="juego" style="width: 100%; max-width: 1024px;"></div>

  <script type="module">
    import { iniciar } from "../js/minijuegos/comida.js";

    const contenedor = document.getElementById("juego");

    function lanzarPrueba() {
      iniciar(contenedor, (resultado) => {
        console.log("Contrato onTerminar recibido:", resultado);
        setTimeout(() => {
          if (confirm(`¡Minijuego de comida completado! (exito: ${resultado.exito})\n¿Probar otra partida con una receta de luz LED nueva?`)) {
            lanzarPrueba();
          }
        }, 300);
      });
    }

    lanzarPrueba();
  </script>
</body>
</html>
